<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4ef">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Kitchen Table Sudoku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --paper: #f5f4ef;
    --paper-2: #ebeae3;
    --ink: #1f2430;
    --ink-soft: #5b6170;
    --line: #2a2f3a;
    --line-thin: #b8bcc6;
    --pen: #1f56c9;
    --cell-empty: #ffffff;
    --cell-tint: #e6ebf4;
    --cell-same: #c9d6ee;
    --cell-sel: #b6d3fb;
    --wrong: #c1302a;
    --wrong-bg: #f8dcd9;
    --btn: #ffffff;
    --btn-2: #eef1f7;
    --btn-border: #c9ccd4;
    --btn-active: #1f2430;
    --btn-active-ink: #f5f4ef;
    --track: #d5d9e3;
    --shadow: 0 1px 0 rgba(31,36,48,.08), 0 6px 18px rgba(31,36,48,.08);
    --ok: #2a7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15181e; --paper-2: #1e222a; --ink: #e8e6df; --ink-soft: #9aa0ad;
      --line: #d9d7cf; --line-thin: #444a57; --pen: #86aaff;
      --cell-empty: #1a1e25; --cell-tint: #262d3a; --cell-same: #2f4670; --cell-sel: #3a5a96;
      --wrong: #ff8a80; --wrong-bg: #4a2624;
      --btn: #232831; --btn-2: #2a303b; --btn-border: #3a404c; --btn-active: #e8e6df; --btn-active-ink: #15181e;
      --track: #3a404c;
      --shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #6fce97;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15181e; --paper-2: #1e222a; --ink: #e8e6df; --ink-soft: #9aa0ad;
    --line: #d9d7cf; --line-thin: #444a57; --pen: #86aaff;
    --cell-empty: #1a1e25; --cell-tint: #262d3a; --cell-same: #2f4670; --cell-sel: #3a5a96;
    --wrong: #ff8a80; --wrong-bg: #4a2624;
    --btn: #232831; --btn-2: #2a303b; --btn-border: #3a404c; --btn-active: #e8e6df; --btn-active-ink: #15181e;
    --track: #3a404c;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); --ok: #6fce97;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }

  /* ---------- frame ---------- */
  .app {
    --board: min(94vw, 50dvh);
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    gap: 14px;
    max-width: 1280px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  header h1 { margin: 0; font-size: 21px; font-weight: 700; }
  header .sub { font-size: 15px; color: var(--ink-soft); }

  main.play {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    align-content: start;
    gap: 16px;
  }
  @media (orientation: landscape) and (min-width: 700px) {
    .app { --board: min(calc(100dvh - 215px), calc(100vw - 372px)); }
    main.play {
      grid-template-columns: var(--board) minmax(300px, 440px);
      justify-content: center;
      align-content: center;
      align-items: stretch;
      gap: 32px;
    }
  }

  /* ---------- board ---------- */
  .board-wrap { width: var(--board); }
  .board {
    display: grid; grid-template-columns: repeat(9, 1fr);
    aspect-ratio: 1;
    border: 3px solid var(--line);
    background: var(--paper-2);
    box-shadow: var(--shadow);
  }
  .cell {
    position: relative; border: 0; padding: 0; margin: 0;
    background: var(--cell-empty);
    color: var(--pen);
    font: inherit; font-weight: 700;
    font-size: calc(var(--board) / 9 * .58);
    line-height: 1;
    border-right: 1px solid var(--line-thin);
    border-bottom: 1px solid var(--line-thin);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .cell[data-c="2"], .cell[data-c="5"] { border-right: 3px solid var(--line); }
  .cell[data-r="2"], .cell[data-r="5"] { border-bottom: 3px solid var(--line); }
  .cell[data-c="8"] { border-right: 0; }
  .cell[data-r="8"] { border-bottom: 0; }
  .cell:focus-visible { outline: 3px solid var(--pen); outline-offset: -3px; }
  .cell.given { color: var(--ink); }
  .cell.filled, .cell.peer { background: var(--cell-tint); }
  .cell.same { background: var(--cell-same); }
  .cell.selected { background: var(--cell-sel); }
  .cell.wrong { color: var(--wrong); background: var(--wrong-bg); }
  .cell.wrong.selected { box-shadow: inset 0 0 0 3px var(--wrong); }
  .notes {
    position: absolute; inset: 2px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    font-size: .36em; font-weight: 400; color: var(--ink-soft); line-height: 1;
  }
  .notes span { display: grid; place-items: center; }

  /* ---------- right panel ---------- */
  .panel {
    width: var(--board);
    display: grid;
    grid-template-rows: auto auto auto;
    gap: 14px;
  }
  @media (orientation: landscape) and (min-width: 700px) {
    .panel { width: auto; height: var(--board); grid-template-rows: auto auto 1fr; }
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { display: grid; gap: 2px; }
  .stat small { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .stat b { font-size: 22px; font-weight: 700; }
  .stat.mistakes.has b { color: var(--wrong); }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button.tool {
    font: inherit; font-size: 17px; font-weight: 700;
    min-height: 58px;
    border-radius: 12px;
    border: 1.5px solid var(--btn-border);
    background: var(--btn); color: var(--ink);
    cursor: pointer;
    display: grid; place-items: center; gap: 2px; padding: 6px 4px;
  }
  button.tool small { font-size: 12px; font-weight: 400; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
  button.tool.on { background: var(--btn-active); color: var(--btn-active-ink); border-color: var(--btn-active); }
  button.tool.on small { color: var(--btn-active-ink); opacity: .75; }
  button.tool:active { transform: translateY(1px); }
  button.tool:disabled { opacity: .4; cursor: default; }
  button.tool:focus-visible, button.key:focus-visible, .btn:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

  .keys { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
  @media (orientation: landscape) and (min-width: 700px) {
    .keys { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; }
  }
  button.key {
    font: inherit; font-size: 32px; font-weight: 700;
    min-height: 64px;
    border-radius: 14px;
    border: 1.5px solid var(--btn-border);
    background: var(--btn-2); color: var(--pen);
    cursor: pointer;
  }
  @media (orientation: landscape) and (min-width: 700px) { button.key { font-size: 44px; min-height: 0; } }
  button.key:active { transform: translateY(1px); }
  button.key.done { opacity: .22; }

  /* ---------- difficulty bar ---------- */
  footer.level {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "head new" "bar new" "ends new";
    column-gap: 20px; row-gap: 6px;
    align-items: center;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--btn);
    border: 1.5px solid var(--btn-border);
    box-shadow: var(--shadow);
  }
  .level-head { grid-area: head; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .level-head small { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .level-head b { font-size: 20px; }
  .level-head .note { font-size: 15px; color: var(--ink-soft); margin-left: auto; }
  .level-ends { grid-area: ends; display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
  input[type="range"] {
    grid-area: bar;
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--pen) var(--fill, 0%), var(--track) var(--fill, 0%)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: -15px; border-radius: 50%; background: var(--btn); border: 3px solid var(--pen); box-shadow: var(--shadow); }
  input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--track); }
  input[type="range"]::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--pen); }
  input[type="range"]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: var(--btn); border: 3px solid var(--pen); }
  input[type="range"]:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 8px; }
  .btn {
    font: inherit; font-size: 18px; font-weight: 700;
    min-height: 56px; padding: 0 22px; border-radius: 12px;
    border: 1.5px solid var(--btn-border); background: var(--btn); color: var(--ink); cursor: pointer;
  }
  .btn.primary { background: var(--pen); color: #fff; border-color: var(--pen); }
  footer .btn { grid-area: new; min-height: 64px; }
  @media (max-width: 520px) {
    footer.level { grid-template-columns: 1fr; grid-template-areas: "head" "bar" "ends" "new"; }
  }

  /* ---------- dialogs ---------- */
  .veil { position: fixed; inset: 0; background: rgba(20, 24, 32, .55); display: grid; place-items: center; padding: 24px; z-index: 10; }
  .sheet {
    background: var(--paper); color: var(--ink);
    border-radius: 18px; padding: 24px; width: min(100%, 420px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    display: grid; gap: 18px;
  }
  .sheet h2 { margin: 0; font-size: 24px; text-wrap: balance; }
  .sheet p { margin: 0; font-size: 17px; color: var(--ink-soft); line-height: 1.4; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .solved-time { font-size: 44px; font-weight: 700; color: var(--ok); }

  @media (prefers-reduced-motion: no-preference) {
    .cell.pop { animation: pop .18s ease-out; }
    @keyframes pop { from { transform: scale(.85); } to { transform: scale(1); } }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Kitchen Table Sudoku</h1>
    <span class="sub" id="filledCount"></span>
  </header>

  <main class="play">
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
    </div>

    <aside class="panel">
      <div class="stats">
        <div class="stat"><small>Difficulty</small><b id="diff">Easy</b></div>
        <div class="stat"><small>Time</small><b id="timer">0:00</b></div>
        <div class="stat mistakes" id="mistakesWrap"><small>Mistakes</small><b id="mistakes">0</b></div>
      </div>
      <div class="tools">
        <button class="tool" id="undoBtn"><span>Undo</span><small>last move</small></button>
        <button class="tool" id="eraseBtn"><span>Erase</span><small>clear cell</small></button>
        <button class="tool" id="notesBtn"><span>Notes</span><small>off</small></button>
      </div>
      <div class="keys" id="keys"></div>
    </aside>
  </main>

  <footer class="level">
    <div class="level-head">
      <small>Difficulty</small>
      <b id="levelName">Easy</b>
      <span class="note" id="levelNote"></span>
    </div>
    <input type="range" id="level" min="0" max="100" step="1" value="30" aria-label="Difficulty">
    <div class="level-ends"><span>Easier</span><span>Harder</span></div>
    <button class="btn primary" id="newBtn">New game</button>
  </footer>
</div>

<div class="veil" id="confirmDialog" hidden>
  <div class="sheet" role="dialog" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Start a new puzzle?</h2>
    <p>Your current puzzle will be cleared.</p>
    <div class="row">
      <button class="btn" id="confirmNo">Keep playing</button>
      <button class="btn primary" id="confirmYes">New puzzle</button>
    </div>
  </div>
</div>

<div class="veil" id="solvedDialog" hidden>
  <div class="sheet" role="dialog" aria-labelledby="solvedTitle">
    <h2 id="solvedTitle">Solved!</h2>
    <div class="solved-time" id="solvedTime">0:00</div>
    <p id="solvedNote"></p>
    <div class="row">
      <button class="btn" id="solvedClose">Look at it</button>
      <button class="btn primary" id="solvedNew">Next puzzle</button>
    </div>
  </div>
</div>

<script>
(() => {
  // =====================================================================
  // puzzle engine: generator, uniqueness check, human-technique rater
  // =====================================================================
  const N = 81;
  const rowOf = i => (i / 9) | 0, colOf = i => i % 9, boxOf = i => ((rowOf(i) / 3) | 0) * 3 + ((colOf(i) / 3) | 0);
  const PEERS = Array.from({ length: N }, (_, i) => {
    const s = [];
    for (let j = 0; j < N; j++) if (j !== i && (rowOf(j) === rowOf(i) || colOf(j) === colOf(i) || boxOf(j) === boxOf(i))) s.push(j);
    return s;
  });
  const UNITS = [];
  for (let r = 0; r < 9; r++) UNITS.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) { const u = []; for (let i = 0; i < N; i++) if (boxOf(i) === b) u.push(i); UNITS.push(u); }
  const ROWS = UNITS.slice(0, 9), COLS = UNITS.slice(9, 18), BOXES = UNITS.slice(18);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function candidates(g, i) {
    let used = 0;
    for (const p of PEERS[i]) if (g[p]) used |= 1 << g[p];
    const out = [];
    for (let d = 1; d <= 9; d++) if (!(used & (1 << d))) out.push(d);
    return out;
  }
  function fillGrid(g) {
    let best = -1, bestC = null;
    for (let i = 0; i < N; i++) {
      if (g[i]) continue;
      const c = candidates(g, i);
      if (c.length === 0) return false;
      if (bestC === null || c.length < bestC.length) { best = i; bestC = c; if (c.length === 1) break; }
    }
    if (best === -1) return true;
    for (const d of shuffle(bestC)) { g[best] = d; if (fillGrid(g)) return true; }
    g[best] = 0;
    return false;
  }
  function countSolutions(g, limit) {
    let best = -1, bestC = null;
    for (let i = 0; i < N; i++) {
      if (g[i]) continue;
      const c = candidates(g, i);
      if (c.length === 0) return 0;
      if (bestC === null || c.length < bestC.length) { best = i; bestC = c; if (c.length === 1) break; }
    }
    if (best === -1) return 1;
    let n = 0;
    for (const d of bestC) { g[best] = d; n += countSolutions(g, limit - n); if (n >= limit) break; }
    g[best] = 0;
    return n;
  }
  function makePuzzle(targetGivens) {
    const sol = new Array(N).fill(0);
    fillGrid(sol);
    const puz = sol.slice();
    let givens = N;
    for (const i of shuffle([...Array(N).keys()])) {
      if (givens <= targetGivens) break;
      const keep = puz[i];
      puz[i] = 0;
      if (countSolutions(puz.slice(), 2) !== 1) puz[i] = keep; else givens--;
    }
    return { puzzle: puz, solution: sol };
  }

  // rater: solves with human techniques only, cheapest first. cost is effort beyond trivial placements.
  const popcount = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  const bitsOf = m => { const o = []; for (let d = 1; d <= 9; d++) if (m & (1 << d)) o.push(d); return o; };
  const COST = { nakedSingle: 0, hiddenSingle: 1, locked: 4, nakedPair: 6, hiddenPair: 8, nakedTriple: 10, xWing: 14 };
  function rate(puzzle) {
    const g = puzzle.slice();
    const cand = new Array(N).fill(0);
    const place = (i, d) => { g[i] = d; cand[i] = 0; for (const p of PEERS[i]) cand[p] &= ~(1 << d); };
    for (let i = 0; i < N; i++) if (!g[i]) { let m = 0; for (const d of candidates(g, i)) m |= 1 << d; cand[i] = m; }
    const used = {}; let cost = 0;
    const tally = k => { cost += COST[k]; used[k] = (used[k] || 0) + 1; };
    const nakedSingle = () => { for (let i = 0; i < N; i++) if (!g[i] && popcount(cand[i]) === 1) { place(i, bitsOf(cand[i])[0]); return true; } return false; };
    const hiddenSingle = () => {
      for (const u of UNITS) for (let d = 1; d <= 9; d++) {
        let where = -1, n = 0;
        for (const i of u) if (!g[i] && (cand[i] & (1 << d))) { n++; where = i; }
        if (n === 1) { place(where, d); return true; }
      }
      return false;
    };
    const eliminate = (cells, mask) => { let did = false; for (const i of cells) if (!g[i] && (cand[i] & mask)) { cand[i] &= ~mask; did = true; } return did; };
    const locked = () => {
      for (const b of BOXES) for (let d = 1; d <= 9; d++) {
        const cells = b.filter(i => !g[i] && (cand[i] & (1 << d)));
        if (cells.length < 2) continue;
        const rs = new Set(cells.map(rowOf)), cs = new Set(cells.map(colOf));
        if (rs.size === 1 && eliminate(ROWS[[...rs][0]].filter(i => !b.includes(i)), 1 << d)) return true;
        if (cs.size === 1 && eliminate(COLS[[...cs][0]].filter(i => !b.includes(i)), 1 << d)) return true;
      }
      for (const line of [...ROWS, ...COLS]) for (let d = 1; d <= 9; d++) {
        const cells = line.filter(i => !g[i] && (cand[i] & (1 << d)));
        if (cells.length < 2) continue;
        const bs = new Set(cells.map(boxOf));
        if (bs.size === 1 && eliminate(BOXES[[...bs][0]].filter(i => !line.includes(i)), 1 << d)) return true;
      }
      return false;
    };
    const nakedSet = size => {
      const combos = (arr, k, start = 0, cur = []) => k === 0 ? [cur] : arr.slice(start).flatMap((x, idx) => combos(arr, k - 1, start + idx + 1, [...cur, x]));
      for (const u of UNITS) {
        const open = u.filter(i => !g[i] && popcount(cand[i]) <= size && popcount(cand[i]) >= 2);
        for (const set of combos(open, size)) {
          let m = 0; for (const i of set) m |= cand[i];
          if (popcount(m) === size && eliminate(u.filter(i => !set.includes(i)), m)) return true;
        }
      }
      return false;
    };
    const hiddenPair = () => {
      for (const u of UNITS) {
        const pos = {};
        for (let d = 1; d <= 9; d++) pos[d] = u.filter(i => !g[i] && (cand[i] & (1 << d)));
        for (let a = 1; a <= 9; a++) for (let b = a + 1; b <= 9; b++) {
          if (pos[a].length === 2 && pos[b].length === 2 && pos[a][0] === pos[b][0] && pos[a][1] === pos[b][1]) {
            const m = (1 << a) | (1 << b); let did = false;
            for (const i of pos[a]) if (cand[i] & ~m) { cand[i] &= m; did = true; }
            if (did) return true;
          }
        }
      }
      return false;
    };
    const xWing = () => {
      for (const [lines, cross, key] of [[ROWS, COLS, colOf], [COLS, ROWS, rowOf]]) {
        for (let d = 1; d <= 9; d++) {
          const two = lines.map(l => l.filter(i => !g[i] && (cand[i] & (1 << d)))).map(c => c.length === 2 ? c.map(key) : null);
          for (let a = 0; a < 9; a++) for (let b = a + 1; b < 9; b++) {
            if (two[a] && two[b] && two[a][0] === two[b][0] && two[a][1] === two[b][1]) {
              let did = false;
              for (const x of two[a]) for (const i of cross[x]) if (!g[i] && (cand[i] & (1 << d)) && !lines[a].includes(i) && !lines[b].includes(i)) { cand[i] &= ~(1 << d); did = true; }
              if (did) return true;
            }
          }
        }
      }
      return false;
    };
    const order = [['nakedSingle', nakedSingle], ['hiddenSingle', hiddenSingle], ['locked', locked], ['nakedPair', () => nakedSet(2)], ['hiddenPair', hiddenPair], ['nakedTriple', () => nakedSet(3)], ['xWing', xWing]];
    for (;;) {
      if (g.every(v => v)) return { solvable: true, cost, used };
      let progressed = false;
      for (const [k, fn] of order) if (fn()) { tally(k); progressed = true; break; }
      if (!progressed) return { solvable: false, cost, used };
    }
  }

  // level 0..100 -> puzzle whose logical effort is closest to target. rejects anything needing guesswork.
  function generateAt(level, budgetMs = 500) {
    const t = level / 100;
    const score = Math.round(t * 26), givens = Math.round(46 - t * 18);
    const t0 = Date.now();
    let best = null;
    for (let k = 0; k < 60 && Date.now() - t0 < budgetMs; k++) {
      const p = makePuzzle(givens + ((Math.random() * 5) | 0) - 2);
      const r = rate(p.puzzle);
      if (!r.solvable) continue;
      const err = Math.abs(r.cost - score);
      if (!best || err < best.err) best = { ...p, err };
      if (err <= 1) break;
    }
    return best || makePuzzle(givens);
  }

  // =====================================================================
  // app
  // =====================================================================
  const KEY = 'kitchen-table-sudoku-v2', LEVEL_KEY = 'kitchen-table-sudoku-level';
  let S = null, selected = -1, notesMode = false, undo = [], tick = null, lastTick = 0;
  const load = k => { try { const j = localStorage.getItem(k); return j ? JSON.parse(j) : null; } catch { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const saveLevel = v => { try { localStorage.setItem(LEVEL_KEY, String(v)); } catch {} };
  const levelName = l => l < 25 ? 'Gentle' : l < 50 ? 'Easy' : l < 75 ? 'Moderate' : 'Medium';
  const levelNum = l => Math.min(10, Math.floor(l / 10) + 1);
  const levelLabel = l => `${levelName(l)} ${levelNum(l)}`;
  const untouched = () => S && !S.solved && S.values.every((v, i) => v === S.puzzle[i]) && S.notes.every(n => n.length === 0);

  function newGame(level) {
    const { puzzle, solution } = generateAt(level);
    S = { level, puzzle, solution, values: puzzle.slice(), notes: Array.from({ length: N }, () => []), mistakes: 0, elapsed: 0, solved: false };
    undo = [];
    selected = puzzle.findIndex(v => v === 0);
    save(); renderAll(); startTimer();
  }

  // ----- dom -----
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), cells = [];
  for (let i = 0; i < N; i++) {
    const b = document.createElement('button');
    b.className = 'cell'; b.dataset.r = rowOf(i); b.dataset.c = colOf(i); b.setAttribute('role', 'gridcell');
    b.addEventListener('pointerdown', e => { e.preventDefault(); selected = i; renderAll(); });
    boardEl.appendChild(b); cells.push(b);
  }
  const keysEl = $('keys'), keys = [];
  for (let d = 1; d <= 9; d++) {
    const k = document.createElement('button');
    k.className = 'key'; k.textContent = d;
    k.addEventListener('pointerdown', e => { e.preventDefault(); enter(d); });
    keysEl.appendChild(k); keys.push(k);
  }
  const fmt = s => `${(s / 60) | 0}:${String(s % 60).padStart(2, '0')}`;
  const levelInput = $('level'), levelNameEl = $('levelName'), levelNote = $('levelNote');

  function renderLevelBar() {
    const l = +levelInput.value;
    levelInput.style.setProperty('--fill', l + '%');
    levelNameEl.textContent = levelLabel(l);
    levelNote.textContent = untouched() ? 'Slide to change this puzzle' : (S && l !== S.level ? 'Applies to your next game' : '');
  }
  function renderAll() {
    $('diff').textContent = levelLabel(S.level);
    $('mistakes').textContent = S.mistakes;
    $('mistakesWrap').classList.toggle('has', S.mistakes > 0);
    $('timer').textContent = fmt(S.elapsed);
    $('undoBtn').disabled = undo.length === 0 || S.solved;
    const selVal = selected >= 0 ? S.values[selected] : 0;
    const counts = new Array(10).fill(0);
    let filled = 0;
    for (let i = 0; i < N; i++) {
      const v = S.values[i], el = cells[i];
      const given = S.puzzle[i] !== 0;
      const wrong = !given && v !== 0 && v !== S.solution[i];
      if (v && !wrong) { counts[v]++; filled++; }
      el.className = 'cell'
        + (given ? ' given' : '')
        + (v ? ' filled' : '')
        + (wrong ? ' wrong' : '')
        + (i === selected ? ' selected'
          : (selVal && v === selVal) ? ' same'
          : (selected >= 0 && PEERS[selected].includes(i)) ? ' peer' : '');
      if (v) { el.textContent = v; el.setAttribute('aria-label', `Row ${rowOf(i) + 1} column ${colOf(i) + 1}, ${v}${wrong ? ', wrong' : ''}`); }
      else if (S.notes[i].length) {
        el.textContent = '';
        const n = document.createElement('div'); n.className = 'notes';
        for (let d = 1; d <= 9; d++) { const s = document.createElement('span'); s.textContent = S.notes[i].includes(d) ? d : ''; n.appendChild(s); }
        el.appendChild(n);
        el.setAttribute('aria-label', `Row ${rowOf(i) + 1} column ${colOf(i) + 1}, notes ${S.notes[i].join(' ')}`);
      } else { el.textContent = ''; el.setAttribute('aria-label', `Row ${rowOf(i) + 1} column ${colOf(i) + 1}, empty`); }
    }
    $('filledCount').textContent = `${filled} / 81 filled`;
    keys.forEach((k, idx) => k.classList.toggle('done', counts[idx + 1] >= 9));
    $('notesBtn').classList.toggle('on', notesMode);
    $('notesBtn').querySelector('small').textContent = notesMode ? 'on' : 'off';
    renderLevelBar();
  }

  // ----- moves -----
  function snapshot() { undo.push({ values: S.values.slice(), notes: S.notes.map(n => n.slice()), mistakes: S.mistakes }); if (undo.length > 200) undo.shift(); }
  function enter(d) {
    if (S.solved || selected < 0 || S.puzzle[selected] !== 0) return;
    snapshot();
    if (notesMode) {
      if (S.values[selected]) S.values[selected] = 0;
      const n = S.notes[selected], at = n.indexOf(d);
      if (at >= 0) n.splice(at, 1); else { n.push(d); n.sort(); }
    } else if (S.values[selected] === d) {
      S.values[selected] = 0;
    } else {
      S.values[selected] = d; S.notes[selected] = [];
      if (d !== S.solution[selected]) S.mistakes++;
      else for (const p of PEERS[selected]) { const n = S.notes[p], at = n.indexOf(d); if (at >= 0) n.splice(at, 1); }
      const el = cells[selected]; el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 200);
    }
    save(); renderAll(); checkSolved();
  }
  function erase() {
    if (S.solved || selected < 0 || S.puzzle[selected] !== 0) return;
    if (!S.values[selected] && !S.notes[selected].length) return;
    snapshot(); S.values[selected] = 0; S.notes[selected] = [];
    save(); renderAll();
  }
  function doUndo() {
    const u = undo.pop(); if (!u) return;
    S.values = u.values; S.notes = u.notes; S.mistakes = u.mistakes;
    save(); renderAll();
  }
  function checkSolved() {
    for (let i = 0; i < N; i++) if (S.values[i] !== S.solution[i]) return;
    S.solved = true; stopTimer(); save(); renderAll();
    $('solvedTime').textContent = fmt(S.elapsed);
    $('solvedNote').textContent = S.mistakes === 0 ? 'No mistakes. Perfect.' : `${S.mistakes} mistake${S.mistakes === 1 ? '' : 's'} along the way.`;
    $('solvedDialog').hidden = false;
  }

  // ----- timer -----
  function startTimer() {
    stopTimer(); if (S.solved) return;
    lastTick = Date.now();
    tick = setInterval(() => {
      const now = Date.now();
      S.elapsed += Math.round((now - lastTick) / 1000); lastTick = now;
      $('timer').textContent = fmt(S.elapsed);
      if (S.elapsed % 10 === 0) save();
    }, 1000);
  }
  function stopTimer() { if (tick) clearInterval(tick); tick = null; }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopTimer(); save(); } else if (S) startTimer(); });

  // ----- controls -----
  $('eraseBtn').addEventListener('pointerdown', e => { e.preventDefault(); erase(); });
  $('undoBtn').addEventListener('pointerdown', e => { e.preventDefault(); doUndo(); });
  $('notesBtn').addEventListener('pointerdown', e => { e.preventDefault(); notesMode = !notesMode; renderAll(); });

  let regenTimer = null;
  levelInput.addEventListener('input', () => {
    const l = +levelInput.value;
    saveLevel(l);
    renderLevelBar();
    if (untouched()) { clearTimeout(regenTimer); regenTimer = setTimeout(() => newGame(l), 120); }
  });

  $('newBtn').addEventListener('click', () => {
    if (untouched() || S.solved) newGame(+levelInput.value); else $('confirmDialog').hidden = false;
  });
  $('confirmNo').addEventListener('click', () => { $('confirmDialog').hidden = true; });
  $('confirmYes').addEventListener('click', () => { $('confirmDialog').hidden = true; newGame(+levelInput.value); });
  $('solvedClose').addEventListener('click', () => { $('solvedDialog').hidden = true; });
  $('solvedNew').addEventListener('click', () => { $('solvedDialog').hidden = true; newGame(+levelInput.value); });

  document.addEventListener('keydown', e => {
    if (!S || !$('confirmDialog').hidden || e.target === levelInput) return;
    if (e.key >= '1' && e.key <= '9') enter(+e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
    else if (e.key === 'n' || e.key === 'N') { notesMode = !notesMode; renderAll(); }
    else if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey)) doUndo();
    else if (e.key.startsWith('Arrow') && selected >= 0) {
      const r = rowOf(selected), c = colOf(selected);
      const m = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
      selected = Math.min(8, Math.max(0, r + m[0])) * 9 + Math.min(8, Math.max(0, c + m[1]));
      renderAll(); e.preventDefault();
    }
  });

  // ----- boot -----
  const savedLevel = (() => { try { const v = localStorage.getItem(LEVEL_KEY); return v === null ? 30 : Math.max(0, Math.min(100, +v)); } catch { return 30; } })();
  levelInput.value = savedLevel;
  const saved = load(KEY);
  if (saved && saved.puzzle && saved.puzzle.length === N && saved.solution && saved.solution.length === N) {
    S = saved;
    selected = S.values.findIndex((v, i) => S.puzzle[i] === 0 && v === 0);
    renderAll(); startTimer();
  } else {
    newGame(savedLevel);
  }
})();
</script>
</body>
</html>
